name: Build multi-platform packages (MeowX core)
on:
  push:
    tags:
      - 'build-revised-*'
  workflow_dispatch:
    inputs:
      from_ci_run_id:
        description: Optional completed CI run ID to reuse its 4-platform artifacts without rebuilding
        type: string
        required: false
        default: ''
      from_package_run_id:
        description: Optional completed revised-packages run ID to publish its already-assembled bundle
        type: string
        required: false
        default: ''
      build_macos_arm64:
        description: Include macOS Apple Silicon (.dmg)
        type: boolean
        default: true
      build_macos_amd64:
        description: Include macOS Intel (.dmg)
        type: boolean
        default: true
      build_linux_amd64:
        description: Include Linux amd64 (.deb)
        type: boolean
        default: true
      build_windows_amd64:
        description: Include Windows amd64 (.exe)
        type: boolean
        default: true
      publish_release:
        description: Publish a GitHub Release with all built packages
        type: boolean
        default: false
      release_tag:
        description: Optional release tag (defaults to revised-v<VERSION>-<short-sha>)
        type: string
        required: false
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: revised-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: ${{ inputs.from_package_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify core pin, script syntax and release contracts
        run: |
          node scripts/check-repository-files.mjs
          node scripts/check-script-syntax.mjs
          node scripts/check-version.mjs
          node --test scripts/build-meowx-core.test.mjs scripts/prepare-release-assets.test.mjs scripts/release-control.test.mjs scripts/fetch-build-artifact.test.mjs

  macos-arm64:
    needs: preflight
    if: ${{ inputs.from_package_run_id == '' && inputs.from_ci_run_id == '' && (github.event_name == 'push' || inputs.build_macos_arm64) }}
    uses: ./.github/workflows/macos-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: revised-macos-arm64

  macos-amd64:
    needs: preflight
    if: ${{ inputs.from_package_run_id == '' && inputs.from_ci_run_id == '' && (github.event_name == 'push' || inputs.build_macos_amd64) }}
    uses: ./.github/workflows/macos-intel-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: revised-macos-amd64

  linux-amd64:
    needs: preflight
    if: ${{ inputs.from_package_run_id == '' && inputs.from_ci_run_id == '' && (github.event_name == 'push' || inputs.build_linux_amd64) }}
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: revised-linux-amd64

  windows-amd64:
    needs: preflight
    if: ${{ inputs.from_package_run_id == '' && inputs.from_ci_run_id == '' && (github.event_name == 'push' || inputs.build_windows_amd64) }}
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: revised-windows-amd64
      all_windows_versions: false

  assemble:
    needs:
      - preflight
      - macos-arm64
      - macos-amd64
      - linux-amd64
      - windows-amd64
    if: >-
      ${{ always() &&
          inputs.from_package_run_id == '' &&
          needs.preflight.result == 'success' &&
          (needs.macos-arm64.result == 'success' || needs.macos-arm64.result == 'skipped') &&
          (needs.macos-amd64.result == 'success' || needs.macos-amd64.result == 'skipped') &&
          (needs.linux-amd64.result == 'success' || needs.linux-amd64.result == 'skipped') &&
          (needs.windows-amd64.result == 'success' || needs.windows-amd64.result == 'skipped') &&
          (inputs.from_ci_run_id != '' || needs.macos-arm64.result == 'success' || needs.macos-amd64.result == 'success' || needs.linux-amd64.result == 'success' || needs.windows-amd64.result == 'success') }}
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      source_sha: ${{ steps.ci_run.outputs.source_sha || github.sha }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify reused CI run status and commit
        id: ci_run
        if: ${{ inputs.from_ci_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.from_ci_run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'from_ci_run_id must be numeric.' >&2; exit 1; }
          status="$(gh api "repos/${REPO}/actions/runs/${CI_RUN_ID}" --jq '.status')"
          conclusion="$(gh api "repos/${REPO}/actions/runs/${CI_RUN_ID}" --jq '.conclusion')"
          head_sha="$(gh api "repos/${REPO}/actions/runs/${CI_RUN_ID}" --jq '.head_sha')"
          if [[ "$status" != completed || "$conclusion" != success ]]; then
            echo "CI run ${CI_RUN_ID} is not successful (status=${status}, conclusion=${conclusion})." >&2
            exit 1
          fi
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid CI run head_sha.' >&2; exit 1; }
          printf 'source_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"
      - name: Download built platform artifacts
        if: ${{ inputs.from_ci_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          path: _output/revised-inputs
      - name: Reuse macOS Apple Silicon artifact from CI run
        if: ${{ inputs.from_ci_run_id != '' && inputs.build_macos_arm64 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.from_ci_run_id }}
          name: cage-macos-arm64-test
          path: _output/revised-inputs/revised-macos-arm64
      - name: Reuse macOS Intel artifact from CI run
        if: ${{ inputs.from_ci_run_id != '' && inputs.build_macos_amd64 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.from_ci_run_id }}
          name: cage-macos-amd64-test
          path: _output/revised-inputs/revised-macos-amd64
      - name: Reuse Linux amd64 artifact from CI run
        if: ${{ inputs.from_ci_run_id != '' && inputs.build_linux_amd64 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.from_ci_run_id }}
          name: cage-linux-amd64-test
          path: _output/revised-inputs/revised-linux-amd64
      - name: Reuse Windows amd64 artifact from CI run
        if: ${{ inputs.from_ci_run_id != '' && inputs.build_windows_amd64 }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.from_ci_run_id }}
          name: cage-windows-amd64-test-windows-2025
          path: _output/revised-inputs/revised-windows-amd64-windows-2025
      - name: Package macOS DMGs and assemble multi-platform bundle
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          core_version="$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)"
          out="$PWD/_output/revised-release"
          mkdir -p "$out"

          for arch in arm64 amd64; do
            dir="$PWD/_output/revised-inputs/revised-macos-$arch"
            if [[ ! -d "$dir" ]]; then
              continue
            fi
            tarball="$(find "$dir" -type f -name "Cage-$version-macos-$arch-test.tar.gz" -print -quit)"
            if [[ -z "$tarball" ]]; then
              echo "Missing macOS $arch tarball in $dir" >&2
              exit 1
            fi
            stage="$(mktemp -d "$RUNNER_TEMP/revised-dmg-$arch.XXXXXX")"
            tar -xzf "$tarball" -C "$stage"
            codesign --verify --deep --strict "$stage/Cage.app"
            if [[ "$arch" == arm64 ]]; then
              "$stage/Cage.app/Contents/Resources/mihomo" -v
            fi
            ln -s /Applications "$stage/Applications"
            cat > "$stage/安装说明 - Read Me.txt" <<EOF
          Cage $version (MeowX core $core_version, ad-hoc build)

          1. 将 Cage.app 拖入 Applications（应用程序）。
          2. 首次启动（未公证构建）如提示无法验证开发者，请在终端执行：
             xattr -dr com.apple.quarantine /Applications/Cage.app
          3. 打开 Cage 并导入 Clash/Mihomo/MeowX 订阅或分享链接。
          EOF
            hdiutil create -volname Cage -srcfolder "$stage" -ov -format UDZO "$out/Cage-$version-macos-$arch-adhoc.dmg"
            rm -rf "$stage"
          done

          if [[ -d "$PWD/_output/revised-inputs/revised-linux-amd64" ]]; then
            linux_deb="$(find "$PWD/_output/revised-inputs/revised-linux-amd64" -type f -name "Cage-$version-linux-amd64.deb" -print -quit)"
            if [[ -n "$linux_deb" ]]; then
              cp "$linux_deb" "$out/"
            fi
          fi

          if [[ -d "$PWD/_output/revised-inputs/revised-windows-amd64-windows-2025" ]]; then
            win_exe="$(find "$PWD/_output/revised-inputs/revised-windows-amd64-windows-2025" -type f -name "Cage-$version-windows-amd64-setup-unsigned.exe" -print -quit)"
            if [[ -n "$win_exe" ]]; then
              cp "$win_exe" "$out/"
            fi
          fi

          node scripts/build-meowx-core.mjs --prefetch-source-only --cache-dir "$out"
          (
            cd "$out"
            shopt -s nullglob
            files=(Cage-* mihomo-*-source.tar.gz)
            if [[ "${#files[@]}" -eq 0 ]]; then
              echo 'No package files assembled.' >&2
              exit 1
            fi
            shasum -a 256 "${files[@]}" > SHA256SUMS
            cat SHA256SUMS
          )
      - name: Upload unified multi-platform packages
        uses: actions/upload-artifact@v4
        with:
          name: claude-cage-revised-packages
          path: _output/revised-release/
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 30

  publish:
    needs: assemble
    if: >-
      ${{ always() &&
          (inputs.from_package_run_id != '' || needs.assemble.result == 'success') &&
          ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/build-revised-')) || inputs.publish_release) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download assembled bundle from current run
        if: ${{ inputs.from_package_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: claude-cage-revised-packages
          path: _output/revised-release
      - name: Download assembled bundle from previous package run
        if: ${{ inputs.from_package_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.from_package_run_id }}
          name: claude-cage-revised-packages
          path: _output/revised-release
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          CI_RUN_ID: ${{ inputs.from_ci_run_id }}
          BUILD_SHA: ${{ needs.assemble.outputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          core_version="$(sed -n 's/^version=//p' scripts/fetch-proxy-core.sh)"
          if [[ "$EVENT_NAME" == push ]]; then
            tag="$REF_NAME"
          elif [[ -n "$INPUT_TAG" ]]; then
            tag="$INPUT_TAG"
          else
            tag="revised-v${version}-${BUILD_SHA:0:7}"
          fi
          shopt -s nullglob
          assets=(_output/revised-release/*)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo 'No release assets found to publish.' >&2
            exit 1
          fi
          notes="Claude Cage ${version} built with MeowX core ${core_version} (commit ${BUILD_SHA:0:7})."
          if [[ -n "$CI_RUN_ID" ]]; then
            notes="${notes} Assembled from verified CI run #${CI_RUN_ID}."
          fi
          if gh release view "$tag" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --repo "$REPO" --clobber
          elif [[ "$EVENT_NAME" == push ]]; then
            gh release create "$tag" "${assets[@]}" \
              --repo "$REPO" \
              --title "Claude Cage Revised ($tag)" \
              --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --repo "$REPO" \
              --target "$BUILD_SHA" \
              --title "Claude Cage Revised ($tag)" \
              --notes "$notes"
          fi
